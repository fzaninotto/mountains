<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur de montagnes</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; font-family: system-ui, sans-serif; }
    canvas#view { display: block; }
    #heightmap {
      position: fixed; left: 16px; bottom: 16px; width: 160px; height: 160px;
      border: 1px solid rgba(255,255,255,.35); border-radius: 6px; image-rendering: pixelated;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
    #status {
      position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px;
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #status.visible { opacity: 1; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/+esm",
        "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="heightmap"></canvas>
  <div id="status"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';
    import GUI from 'lil-gui';
    import { createNoise2D } from 'simplex-noise';

    const WORLD_SIZE = 100;

    const params = {
      seed: 1337,
      resolution: 256,
      scale: 2.2,
      octaves: 7,
      persistence: 0.45,
      lacunarity: 2.05,
      ridgeMix: 0.65,
      warp: 0.35,
      sharpness: 1.15,
      falloff: 0.9,
      droplets: 200000,
      heightScale: 28,
      waterLevel: 0.12,
      treeLine: 0.45,
      snowLine: 0.62,
      sunElevation: 18,
      sunAzimuth: 210,
      fog: 0.004,
      exportScale: 2,
    };

    // ---------- Relief ----------

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function smoothstep(a, b, x) {
      const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }

    function generateHeightmap(p) {
      const n = p.resolution;
      const rng = mulberry32(p.seed);
      const noise = createNoise2D(rng);
      const warpNoise = createNoise2D(rng);

      const fbm = (x, y, octaves) => {
        let sum = 0, amp = 1, freq = 1, norm = 0;
        for (let o = 0; o < octaves; o++) {
          sum += amp * noise(x * freq, y * freq);
          norm += amp;
          amp *= p.persistence;
          freq *= p.lacunarity;
        }
        return sum / norm;
      };

      const ridged = (x, y) => {
        let sum = 0, amp = 1, freq = 1, norm = 0;
        for (let o = 0; o < p.octaves; o++) {
          const v = 1 - Math.abs(noise(x * freq + 31.7, y * freq - 12.3));
          sum += amp * v * v;
          norm += amp;
          amp *= p.persistence;
          freq *= p.lacunarity;
        }
        return sum / norm;
      };

      const map = new Float32Array(n * n);
      for (let j = 0; j < n; j++) {
        for (let i = 0; i < n; i++) {
          const u = i / (n - 1), v = j / (n - 1);
          let x = u * p.scale, y = v * p.scale;
          x += p.warp * warpNoise(x * 0.8 + 5.2, y * 0.8 + 1.3);
          y += p.warp * warpNoise(x * 0.8 + 1.7, y * 0.8 + 9.2);

          const base = fbm(x, y, p.octaves) * 0.5 + 0.5;
          const mask = smoothstep(-0.6, 0.6, warpNoise(x * 0.35 - 7.1, y * 0.35 + 3.9));
          let h = (base * (1 - p.ridgeMix) + ridged(x, y) * p.ridgeMix) * (0.5 + 0.5 * mask);

          const d = Math.hypot(u - 0.5, v - 0.5) * 2;
          h *= 1 - p.falloff * smoothstep(0.3, 1, d);

          map[j * n + i] = h;
        }
      }

      // Normalisation robuste : on ignore les quelques pics extrêmes
      const sorted = map.slice().sort();
      const min = sorted[Math.floor(sorted.length * 0.002)];
      const max = sorted[Math.floor(sorted.length * 0.998)];
      for (let k = 0; k < map.length; k++) {
        map[k] = Math.pow(Math.min(1, Math.max(0, (map[k] - min) / (max - min))), p.sharpness);
      }
      return map;
    }

    // Érosion hydraulique par gouttes (inspirée de Sebastian Lague)
    function erode(map, n, droplets, seed) {
      const rng = mulberry32(seed ^ 0x9e3779b9);
      const inertia = 0.05, capacityFactor = 4, minCapacity = 0.01;
      const erodeSpeed = 0.3, depositSpeed = 0.3, evaporate = 0.01, gravity = 4, maxLifetime = 30;
      const radius = Math.max(2, Math.round(3 * n / 256));

      const brush = [];
      let weightSum = 0;
      for (let oy = -radius; oy <= radius; oy++) {
        for (let ox = -radius; ox <= radius; ox++) {
          const d = Math.hypot(ox, oy);
          if (d <= radius) {
            const w = 1 - d / radius;
            brush.push(ox, oy, w);
            weightSum += w;
          }
        }
      }
      for (let k = 2; k < brush.length; k += 3) brush[k] /= weightSum;

      const sample = (x, y, out) => {
        const cx = Math.floor(x), cy = Math.floor(y);
        const fx = x - cx, fy = y - cy;
        const i = cy * n + cx;
        const nw = map[i], ne = map[i + 1], sw = map[i + n], se = map[i + n + 1];
        out.gx = (ne - nw) * (1 - fy) + (se - sw) * fy;
        out.gy = (sw - nw) * (1 - fx) + (se - ne) * fx;
        out.h = nw * (1 - fx) * (1 - fy) + ne * fx * (1 - fy) + sw * (1 - fx) * fy + se * fx * fy;
      };

      const s = { h: 0, gx: 0, gy: 0 };
      for (let d = 0; d < droplets; d++) {
        let x = rng() * (n - 1), y = rng() * (n - 1);
        let dx = 0, dy = 0, speed = 1, water = 1, sediment = 0;

        for (let life = 0; life < maxLifetime; life++) {
          const cx = Math.floor(x), cy = Math.floor(y);
          const fx = x - cx, fy = y - cy;
          const idx = cy * n + cx;

          sample(x, y, s);
          const h = s.h;
          dx = dx * inertia - s.gx * (1 - inertia);
          dy = dy * inertia - s.gy * (1 - inertia);
          const len = Math.hypot(dx, dy);
          if (len === 0) break;
          dx /= len; dy /= len;
          x += dx; y += dy;
          if (x < 0 || x >= n - 1 || y < 0 || y >= n - 1) break;

          sample(x, y, s);
          const deltaH = s.h - h;
          const capacity = Math.max(-deltaH * speed * water * capacityFactor, minCapacity);

          if (sediment > capacity || deltaH > 0) {
            const amount = deltaH > 0 ? Math.min(deltaH, sediment) : (sediment - capacity) * depositSpeed;
            sediment -= amount;
            map[idx] += amount * (1 - fx) * (1 - fy);
            map[idx + 1] += amount * fx * (1 - fy);
            map[idx + n] += amount * (1 - fx) * fy;
            map[idx + n + 1] += amount * fx * fy;
          } else {
            const amount = Math.min((capacity - sediment) * erodeSpeed, -deltaH);
            for (let k = 0; k < brush.length; k += 3) {
              const bx = cx + brush[k], by = cy + brush[k + 1];
              if (bx < 0 || by < 0 || bx >= n || by >= n) continue;
              const bi = by * n + bx;
              const delta = Math.min(map[bi], amount * brush[k + 2]);
              map[bi] -= delta;
              sediment += delta;
            }
          }

          speed = Math.sqrt(Math.max(0, speed * speed - deltaH * gravity));
          water *= 1 - evaporate;
        }
      }
    }

    function drawHeightmap(map, n) {
      const canvas = document.getElementById('heightmap');
      canvas.width = n;
      canvas.height = n;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(n, n);
      for (let k = 0; k < map.length; k++) {
        const v = Math.max(0, Math.min(255, map[k] * 255));
        img.data[k * 4] = img.data[k * 4 + 1] = img.data[k * 4 + 2] = v;
        img.data[k * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }

    // ---------- Rendu 3D ----------

    const canvas = document.getElementById('view');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.55;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xb9c8d8, params.fog);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 20000);
    camera.position.set(95, 48, 95);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 8, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.minDistance = 10;
    controls.maxDistance = 400;

    const sky = new Sky();
    sky.scale.setScalar(10000);
    sky.material.uniforms.turbidity.value = 6;
    sky.material.uniforms.rayleigh.value = 1.6;
    sky.material.uniforms.mieCoefficient.value = 0.004;
    sky.material.uniforms.mieDirectionalG.value = 0.85;

    const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 400 });
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04;
    scene.add(sun, sun.target);
    scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x4a3f33, 0.35));

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    let envTarget;

    function updateSun() {
      const phi = THREE.MathUtils.degToRad(90 - params.sunElevation);
      const theta = THREE.MathUtils.degToRad(params.sunAzimuth);
      const dir = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);

      sky.material.uniforms.sunPosition.value.copy(dir);
      sun.position.copy(dir).multiplyScalar(180);
      const warmth = smoothstep(0, 25, params.sunElevation);
      sun.color.setRGB(1, 0.72 + 0.26 * warmth, 0.5 + 0.42 * warmth);
      sun.intensity = 0.6 + 2.8 * smoothstep(-2, 20, params.sunElevation);

      envTarget?.dispose();
      envScene.add(sky);
      envTarget = pmrem.fromScene(envScene);
      scene.add(sky);
      scene.environment = envTarget.texture;
      scene.environmentIntensity = 0.6;
    }

    const terrainMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
    const terrain = new THREE.Mesh(new THREE.BufferGeometry(), terrainMaterial);
    terrain.castShadow = true;
    terrain.receiveShadow = true;
    scene.add(terrain);

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(20000, 20000).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x1f4f66, roughness: 0.08, metalness: 0.1 }),
    );
    water.receiveShadow = true;
    scene.add(water);

    let heightmap = null;

    const palette = {
      sand: new THREE.Color(0xb8a77f),
      grass: new THREE.Color(0x587a34),
      forest: new THREE.Color(0x2d4422),
      alpine: new THREE.Color(0x7c7a55),
      rock: new THREE.Color(0x6f655c),
      darkRock: new THREE.Color(0x4a433e),
      snow: new THREE.Color(0xf2f5fa),
    };

    function buildTerrainGeometry() {
      const n = params.resolution;
      const geometry = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, n - 1, n - 1).rotateX(-Math.PI / 2);
      const pos = geometry.attributes.position;
      for (let k = 0; k < pos.count; k++) pos.setY(k, heightmap[k] * params.heightScale);
      geometry.computeVertexNormals();
      terrain.geometry.dispose();
      terrain.geometry = geometry;
      colorTerrain();
    }

    function colorTerrain() {
      const geometry = terrain.geometry;
      const normals = geometry.attributes.normal;
      const colors = new Float32Array(normals.count * 3);
      const jitter = createNoise2D(mulberry32(params.seed + 7));
      const n = params.resolution;
      const c = new THREE.Color(), tmp = new THREE.Color();

      for (let k = 0; k < normals.count; k++) {
        const h = heightmap[k];
        const slope = 1 - normals.getY(k);
        const u = (k % n) / n, v = Math.floor(k / n) / n;
        const j = jitter(u * 40, v * 40) * 0.04;

        c.lerpColors(palette.grass, palette.forest, smoothstep(params.waterLevel + 0.05, params.treeLine * 0.8, h + j));
        c.lerp(tmp.copy(palette.alpine), smoothstep(params.treeLine - 0.05, params.treeLine + 0.05, h + j));
        c.lerp(palette.sand, 1 - smoothstep(params.waterLevel, params.waterLevel + 0.025, h));

        const rockColor = tmp.lerpColors(palette.rock, palette.darkRock, smoothstep(0.4, 0.8, slope + j * 3));
        c.lerp(rockColor, smoothstep(0.18, 0.32, slope + j));

        const snow = smoothstep(params.snowLine - 0.03, params.snowLine + 0.03, h + j * 1.5) * (1 - smoothstep(0.35, 0.55, slope));
        c.lerp(palette.snow, snow);

        colors[k * 3] = c.r;
        colors[k * 3 + 1] = c.g;
        colors[k * 3 + 2] = c.b;
      }
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    }

    function updateWater() {
      water.position.y = params.waterLevel * params.heightScale;
    }

    // ---------- Interface ----------

    const status = document.getElementById('status');
    function showStatus(text) {
      status.textContent = text;
      status.classList.toggle('visible', !!text);
    }

    function generate() {
      showStatus('Génération du relief…');
      setTimeout(() => {
        const t0 = performance.now();
        heightmap = generateHeightmap(params);
        erode(heightmap, params.resolution, params.droplets, params.seed);
        drawHeightmap(heightmap, params.resolution);
        buildTerrainGeometry();
        updateWater();
        showStatus(`Relief généré en ${Math.round(performance.now() - t0)} ms`);
        setTimeout(() => showStatus(''), 1500);
      }, 30);
    }

    function exportPNG() {
      const ratio = renderer.getPixelRatio();
      renderer.setPixelRatio(params.exportScale);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.render(scene, camera);
      const link = document.createElement('a');
      link.download = `montagne-${params.seed}.png`;
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();
      renderer.setPixelRatio(ratio);
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const actions = {
      generate,
      randomize() {
        params.seed = Math.floor(Math.random() * 1e6);
        gui.controllersRecursive().forEach((ctrl) => ctrl.updateDisplay());
        generate();
      },
      exportPNG,
    };

    const gui = new GUI({ title: 'Montagnes' });
    gui.add(actions, 'randomize').name('🎲 Nouvelle graine');
    gui.add(params, 'seed', 0, 999999, 1).name('Graine').onFinishChange(generate);

    const relief = gui.addFolder('Relief');
    relief.add(params, 'resolution', [128, 256, 384, 512]).name('Résolution').onFinishChange(generate);
    relief.add(params, 'scale', 0.5, 6, 0.05).name('Échelle').onFinishChange(generate);
    relief.add(params, 'octaves', 1, 10, 1).name('Octaves').onFinishChange(generate);
    relief.add(params, 'persistence', 0.2, 0.8, 0.01).name('Persistance').onFinishChange(generate);
    relief.add(params, 'lacunarity', 1.5, 3, 0.01).name('Lacunarité').onFinishChange(generate);
    relief.add(params, 'ridgeMix', 0, 1, 0.01).name('Crêtes').onFinishChange(generate);
    relief.add(params, 'warp', 0, 1.5, 0.01).name('Distorsion').onFinishChange(generate);
    relief.add(params, 'sharpness', 0.5, 3, 0.05).name('Acuité des pics').onFinishChange(generate);
    relief.add(params, 'falloff', 0, 1, 0.01).name('Massif central').onFinishChange(generate);
    relief.add(params, 'droplets', 0, 500000, 10000).name('Érosion (gouttes)').onFinishChange(generate);

    const look = gui.addFolder('Rendu');
    look.add(params, 'heightScale', 5, 70, 1).name('Altitude').onChange(() => { buildTerrainGeometry(); updateWater(); });
    look.add(params, 'waterLevel', 0, 0.5, 0.005).name('Niveau de l’eau').onChange(() => { updateWater(); colorTerrain(); });
    look.add(params, 'treeLine', 0.1, 0.9, 0.01).name('Limite des forêts').onChange(colorTerrain);
    look.add(params, 'snowLine', 0.2, 1, 0.01).name('Limite des neiges').onChange(colorTerrain);
    look.add(params, 'sunElevation', -2, 80, 0.5).name('Hauteur du soleil').onChange(updateSun);
    look.add(params, 'sunAzimuth', 0, 360, 1).name('Azimut du soleil').onChange(updateSun);
    look.add(params, 'fog', 0, 0.025, 0.0005).name('Brume').onChange((v) => { scene.fog.density = v; });

    const exp = gui.addFolder('Export');
    exp.add(params, 'exportScale', [1, 2, 3, 4]).name('Facteur de taille');
    exp.add(actions, 'exportPNG').name('📷 Exporter en PNG');

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateSun();
    generate();

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
